# Model catalog used by ai_engineer.claude (routing, cost, budgets).
#
# List prices from the provider's pricing page, checked on the date below.
# PRICES CHANGE. Before you make a decision with these numbers, check the
# current page, update this file and commit it with the new date.
#
# Units: USD per million tokens (MTok). Cache and batch multipliers are
# applied in code (see ai_engineer/claude/cost.py):
#   cache write, 5-minute TTL = 1.25 x input    batch = 0.50 x everything
#   cache write, 1-hour TTL   = 2.00 x input
#   cache read = cache_read_multiplier x input (default 0.10)
# A model priced by prompt length has a long_prompt table: a prompt of
# more than `above` tokens pays those prices for the whole call, and the
# multipliers apply to them.

