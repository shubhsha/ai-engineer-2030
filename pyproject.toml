[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-engineer-2030"
dynamic = ["version"]
description = "Companion code for 'AI Engineer 2030: The Architect's Field Guide'."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shubham Sharma" }]
keywords = ["ai-engineering", "agents", "rag", "evaluation", "llm", "claude"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26",
  "typing-extensions>=4.12; python_version < '3.12'",
]

[project.optional-dependencies]
claude = ["anthropic>=1.11,<2"]
mcp = ["mcp>=2.3,<3"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = [
  "pytest>=8.2",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "fastapi>=0.115",
  "httpx2>=2.13",  # what Starlette's TestClient sends requests with
]

[project.scripts]
aie = "ai_engineer.cli:main"

[project.urls]
Homepage = "https://github.com/shubhsha/ai-engineer-2030"
Source = "https://github.com/shubhsha/ai-engineer-2030"
Issues = "https://github.com/shubhsha/ai-engineer-2030/issues"
Changelog = "https://github.com/shubhsha/ai-engineer-2030/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/ai_engineer/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_engineer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: long-running (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 79
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["book/build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", ".claude/hooks"]

[[tool.mypy.overrides]]
module = ["anthropic.*", "mcp.*", "fastapi.*", "uvicorn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Without the optional mcp extra, mypy cannot see that the SDK's
# decorators are typed, and the core-only CI job checks without it.
module = ["ai_engineer.mcp_server.*"]
disallow_untyped_decorators = false
